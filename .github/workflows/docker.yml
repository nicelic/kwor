name: Docker Image CI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate release version
        id: release
        shell: bash
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          node scripts/sync-version.mjs --check

          version="$(tr -d '\r\n' < config/version)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-._A-Za-z0-9]+)?$ ]]; then
            echo "Invalid version in config/version: $version" >&2
            exit 1
          fi

          tag="v${version}"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            if [ "$RELEASE_EVENT_TAG" != "$tag" ]; then
              echo "Release tag $RELEASE_EVENT_TAG does not match config/version ($tag)" >&2
              exit 1
            fi
          fi

          publish_latest=false
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            publish_latest=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish_latest=$publish_latest" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.publish_latest == 'true' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Go version
        id: go-version
        shell: bash
        run: |
          go_version="$(awk '/^go / { print $2; exit }' go.mod)"
          if [ -z "$go_version" ]; then
            echo "Failed to read Go version from go.mod" >&2
            exit 1
          fi
          echo "Using Go ${go_version} for Docker build"
          echo "value=${go_version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'release' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            GO_VERSION=${{ steps.go-version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test published images
        if: github.event_name == 'release'
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            echo "Checking $IMAGE:$RELEASE_TAG on $platform"
            output="$(docker run --rm --platform "$platform" "$IMAGE:$RELEASE_TAG" version)"
            printf '%s\n' "$output"
            if ! grep -Fq "$RELEASE_VERSION" <<< "$output"; then
              echo "Image version check failed for $platform" >&2
              exit 1
            fi
          done
